; =========================

; 规则集定义

; =========================

; ===== 防泄露规则 (拦截STUN) =====

; 拦截 STUN（WebRTC），防止浏览器真实 IP 泄露
ruleset=REJECT,[]DOMAIN-KEYWORD,stun

; ===== 私人定制 =====
ruleset=🇨🇳 全球直连,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/regions/CN.list

; ===== 金融 =====
ruleset=🐮 Futu,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Futu.list

; ===== AI =====
ruleset=🤖 AI,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/AI.list

; ===== Google =====
ruleset=📢 FCM,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/FCM.list
ruleset=📹 YouTube,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/YouTube.list
ruleset=🍀 Google,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Google.list

; ===== 流媒体 =====
ruleset=🎵 Spotify,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Spotify.list
ruleset=📱 TikTok,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/TikTok.list
ruleset=📘 Meta,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Meta.list

; ===== 通讯 / 社交 =====
ruleset=🍎 Apple,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Apple.list
ruleset=📲 Telegram,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Telegram.list
ruleset=🐦 X,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/X.list

; ===== 开发 =====
ruleset=👨🏿‍💻 GitHub,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/GitHub.list
ruleset=🪟 Microsoft,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Microsoft.list
ruleset=♻️ Speedtest,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Speedtest.list

; ===== 游戏平台 =====
ruleset=🇨🇳 全球直连,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/GamesDirect.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/rules/Games.list

; ===== 私人定制 地区分流=====
ruleset=🇹🇼 TW,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/regions/TW.list
ruleset=🇺🇸 US,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/regions/US.list
ruleset=🇭🇰 HK,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/regions/HK.list
ruleset=🇸🇬 SG,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/regions/SG.list

; ===== GEO 规则（兜底逻辑）=====
ruleset=🇨🇳 全球直连,https://raw.githubusercontent.com/Gufiye/Rule/refs/heads/main/regions/CN-final.list,no-resolve
ruleset=🇨🇳 全球直连,[]GEOSITE,category-public-tracker
ruleset=🇨🇳 全球直连,[]GEOSITE,CN
ruleset=🇨🇳 全球直连,[]GEOIP,CN,no-resolve
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn

; ===== 最终兜底 =====
ruleset=🐟 漏网之鱼,[]FINAL





# =========================
# 核心入口
# =========================
custom_proxy_group=🚀 节点选择`select`[]🇺🇸 美国节点`[]DIRECT
custom_proxy_group=🐸 手动切换`select`.*

# =========================
# 流媒体 / AI / 常用服务
# =========================
custom_proxy_group=📹 YouTube`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🎵 Spotify`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=📱 TikTok`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🤖 AI`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=📘 Meta`select`[]🚀 节点选择`[]DIRECT
custom_proxy_group=🐮 Futu`select`[]DIRECT`[]🚀 节点选择

