; =========================
;
; VPS 专用分流配置（QuantumultX / 与 klein.ini 同款写法）
;
; 节点：66Cloud 美国 CN2（154.36.136.82，VLESS + Reality，单节点精简版）
; 用法：与 klein.ini 相同，配合你的节点订阅使用
;
; 节点命名要求：节点 tag 必须叫「🇺🇸 美国CN2」，策略组靠这个名字抓节点
; （如果你以后加香港/新加坡节点，tag 按 🇭🇰 香港 / 🇸🇬 新加坡 命名，再告诉我，我帮你把分组补上）
;
; VLESS Reality 节点行模板（填好后取消注释，放到你的 [server_local] 里）：
; vless=154.36.136.82:443, method=none, password=你的UUID, tag=🇺🇸 美国CN2, tls=true, sni=www.intel.com, reality=true, pbk=你的Reality公钥, sid=你的shortId
; 需要的三样东西都在 3X-UI 面板 → 入站列表 → 客户端详情里：UUID、Reality 公钥(pbk)、shortId(sid)
; 或者把 3X-UI 的 vless:// 分享链接发我，我帮你转成上面这一行
;
; =========================

; =========================

; 规则集定义

; =========================

; ===== 防泄露规则 (拦截STUN) =====

; 拦截 STUN（WebRTC），防止浏览器真实 IP 泄露

ruleset=REJECT,[]DOMAIN-KEYWORD,stun

